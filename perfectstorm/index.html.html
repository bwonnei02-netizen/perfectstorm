<script>
(function(){
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}

const $=id=>document.getElementById(id);
const STAGES=[
 {n:'قبل العاصفة 🌆',c:['#2a1650','#8a4f9e'],gap:3.4,warn:1.3,dbl:0,wind:0,rain:40},
 {n:'المطر 🌧️',c:['#0a1a3a','#27508a'],gap:2.6,warn:1.1,dbl:0,wind:0,rain:220},
 {n:'الرعد ⚡',c:['#060510','#17112d'],gap:1.9,warn:1.0,dbl:.35,wind:0,rain:260},
 {n:'الرياح 💨',c:['#050910','#0b1b2b'],gap:2.1,warn:1.0,dbl:.2,wind:1,rain:320},
 {n:'عين العاصفة 🌀',c:['#05040b','#1a0a24'],gap:1.5,warn:.9,dbl:.5,wind:1.6,rain:380}
];
const MEMBERS=[
  {id:'soobin',name:'سوبين',hair:'#171b24',skin:'#ffe2d3',outfit:'#111a29',trim:'#b9d8ee',glow:'#8bdcff',style:'swept',phase:.2,accessory:'papers'},
 {id:'yeonjun',name:'يونجون',hair:'#28232b',skin:'#f6d8c8',outfit:'#17191e',trim:'#f4f1ee',glow:'#ff9a91',style:'swept',phase:1.1,accessory:'helmet'},
  {id:'beomgyu',name:'بومقيو',hair:'#17151b',skin:'#ffe0ce',outfit:'#39283f',trim:'#c0a9c8',glow:'#c5a3ff',style:'wavy',phase:2.2,accessory:'clip'},
  {id:'taehyun',name:'تايهيون',hair:'#28292d',skin:'#f4d8c6',outfit:'#252a30',trim:'#aebfca',glow:'#9ce4bd',style:'short',phase:3.1,accessory:'cowboyHat'},
 {id:'hueningkai',name:'كاي',hair:'#e8edf2',skin:'#ffe4cf',outfit:'#17243b',trim:'#c5d0dd',glow:'#ffd58b',style:'parted',phase:4.2,accessory:'ribbon'}
];
const STAGE_TIME=25;
let best=0;try{best=+localStorage.getItem('ps_best')||0}catch(e){}
let snd=true,AC=null;
let rainSource=null,rainGain=null,rainFilter=null,rainStage=-1;
function ac(){if(!AC||AC.state==='closed'){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')try{const resumed=AC.resume();if(resumed&&resumed.catch)resumed.catch(()=>{})}catch(e){}return AC}
function beep(f,d,t,v){if(!snd)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),gn=a.createGain();o.type=t||'sine';o.frequency.value=f;gn.gain.value=v||.06;gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function thunder(big){
 if(!snd)return;const a=ac();if(!a)return;
 try{
  const now=a.currentTime,duration=big?1.25:.55,n=Math.floor(a.sampleRate*duration),buffer=a.createBuffer(1,n,a.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/n,big?1.35:2.1);
  const source=a.createBufferSource();source.buffer=buffer;
  const low=a.createBiquadFilter();low.type='lowpass';low.frequency.setValueAtTime(big?560:900,now);low.frequency.exponentialRampToValueAtTime(big?85:160,now+duration);
  const rumble=a.createGain();rumble.gain.setValueAtTime(big?.32:.14,now);rumble.gain.exponentialRampToValueAtTime(.0001,now+duration);
  source.connect(low).connect(rumble).connect(a.destination);
  if(big){
   const crackFilter=a.createBiquadFilter();crackFilter.type='highpass';crackFilter.frequency.value=1200;
   const crack=a.createGain();crack.gain.setValueAtTime(.14,now);crack.gain.exponentialRampToValueAtTime(.0001,now+.14);
   source.connect(crackFilter).connect(crack).connect(a.destination);
   const sub=a.createOscillator(),subGain=a.createGain();sub.type='sine';sub.frequency.setValueAtTime(78,now);sub.frequency.exponentialRampToValueAtTime(34,now+duration);
   subGain.gain.setValueAtTime(.11,now);subGain.gain.exponentialRampToValueAtTime(.0001,now+duration);sub.connect(subGain).connect(a.destination);sub.start(now);sub.stop(now+duration);
  }
  source.start(now);source.stop(now+duration);
 }catch(e){}
}
function windGust(power){
 if(!snd)return;const a=ac();if(!a)return;
 try{
  const now=a.currentTime,duration=1.7,n=Math.floor(a.sampleRate*duration),buffer=a.createBuffer(1,n,a.sampleRate),data=buffer.getChannelData(0);let smooth=0;
  for(let i=0;i<n;i++){smooth=smooth*.72+(Math.random()*2-1)*.28;data[i]=smooth}
  const source=a.createBufferSource();source.buffer=buffer;
  const low=a.createBiquadFilter();low.type='lowpass';low.frequency.value=480+power*520;low.Q.value=.7;
  const high=a.createBiquadFilter();high.type='highpass';high.frequency.value=65;
  const gain=a.createGain();gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.025+power*.025,now+.28);gain.gain.setTargetAtTime(.0001,now+.28,.48);
  source.connect(low).connect(high).connect(gain).connect(a.destination);source.start(now);source.stop(now+duration);
 }catch(e){}
}
function syncRainAudio(){
 const active=snd&&S==='play'&&!paused&&st;
 if(!active){
  if(rainSource){
   const now=AC?AC.currentTime:0;
   if(rainGain&&AC){rainGain.gain.cancelScheduledValues(now);rainGain.gain.setTargetAtTime(0,now,.08)}
   try{rainSource.stop(now+.35)}catch(e){}
   rainSource=null;rainGain=null;rainFilter=null;rainStage=-1;
  }
  return;
 }
 const a=ac();if(!a||a.state!=='running')return;
 if(!rainSource){
  const duration=2,n=Math.floor(a.sampleRate*duration),buffer=a.createBuffer(1,n,a.sampleRate),data=buffer.getChannelData(0);let smooth=0;
  for(let i=0;i<n;i++){smooth=smooth*.78+(Math.random()*2-1)*.22;data[i]=smooth*1.4}
  rainSource=a.createBufferSource();rainSource.buffer=buffer;rainSource.loop=true;
  const high=a.createBiquadFilter();high.type='highpass';high.frequency.value=120;
  rainFilter=a.createBiquadFilter();rainFilter.type='lowpass';rainFilter.frequency.value=2200;
  rainGain=a.createGain();rainGain.gain.value=.0001;
  rainSource.connect(high).connect(rainFilter).connect(rainGain).connect(a.destination);rainSource.start();
  rainStage=-1;
 }
 if(rainStage!==st.stage){
  const intensity=Math.min(1,STAGES[st.stage].rain/380),now=a.currentTime;
  rainGain.gain.cancelScheduledValues(now);rainGain.gain.setTargetAtTime(.032+intensity*.055,now,.45);
  rainFilter.frequency.setTargetAtTime(1500+intensity*2700,now,.5);
  rainStage=st.stage;
 }
}

function drawMember(id,x,y,size,ctx=g){
 const m=MEMBERS.find(member=>member.id===id)||MEMBERS[0];
  const unit=size/72,now=gameClock,blink=Math.sin(now*2.1+m.phase)>0.995;

  if(id==='soobin'){

   ctx.strokeStyle='rgba(144,180,207,.48)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-7,22);ctx.lineTo(-6,29);ctx.moveTo(7,22);ctx.lineTo(6,29);ctx.stroke();
   ctx.fillStyle='#182337';ctx.strokeStyle='#748da8';ctx.lineWidth=.75;

    roundedRect(18,75,W-36,4,3);g.fillStyle='rgba(255,255,255,.17)';g.fill();
    roundedRect(18,75,Math.max(8,(W-36)*((st.stage*STAGE_TIME+st.t2)/(5*STAGE_TIME))),4,3);g.fillStyle=STAGES[st.stage].c[1];g.shadowColor=STAGES[st.stage].c[1];g.shadowBlur=8;g.fill();g.shadowBlur=0;
    if(st.banner>0){g.save();g.globalAlpha=Math.min(1,st.banner);roundedRect(W/2-142,H*.27,284,84,22);g.fillStyle='rgba(21,16,55,.72)';g.fill();g.strokeStyle='rgba(230,222,255,.2)';g.stroke();g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(255,255,255,.72)';g.font='700 12px system-ui,sans-serif';g.fillText('العاصفة تشتد',W/2,H*.27+21);g.fillStyle='#fff';g.font='850 24px system-ui,sans-serif';g.shadowColor=STAGES[st.stage].c[1];g.shadowBlur=16;g.fillText(STAGES[st.stage].n,W/2,H*.27+52);g.restore()}
    if(Math.abs(st.wind)>20){g.save();g.textAlign='center';g.textBaseline='top';g.font='700 18px system-ui,sans-serif';g.fillStyle='rgba(235,245,255,.9)';g.shadowColor='#8de9ff';g.shadowBlur=12;g.fillText(st.wind>0?'💨  ➜':'⬅  💨',W/2,91);g.restore()}
   }else if(S==='menu'){
    g.save();g.translate(W/2,H*.61+Math.sin(now*2.2)*5);g.shadowColor='#b9a8ff';g.shadowBlur=26;g.fillStyle='#b9a8ff';g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2===0?36:18,x=Math.cos(a)*r,y=Math.sin(a)*r;i===0?g.moveTo(x,y):g.lineTo(x,y)}g.closePath();g.fill();g.shadowBlur=0;const hero=g.createLinearGradient(-25,-28,25,32);hero.addColorStop(0,'#fff3bf');hero.addColorStop(.48,'#dfccff');hero.addColorStop(1,'#9a7de8');g.fillStyle=hero;g.lineWidth=2.6;g.strokeStyle='#fff';g.stroke();g.fillStyle='#382a66';g.beginPath();g.ellipse(-8,0,2.8,4.4,0,0,Math.PI*2);g.ellipse(8,0,2.8,4.4,0,0,Math.PI*2);g.fill();g.strokeStyle='#6d4d82';g.lineWidth=2;g.beginPath();g.moveTo(-3,10);g.quadraticCurveTo(0,14,3,10);g.stroke();g.fillStyle='#ff9dbf';g.beginPath();g.ellipse(-15,7,4,2.5,0,0,Math.PI*2);g.ellipse(15,7,4,2.5,0,0,Math.PI*2);g.fill();g.restore();
   }
  }
  if(flash>0){g.save();g.fillStyle='rgba(245,242,255,'+flash*.44+')';g.fillRect(0,0,W,H);g.restore()}
  if(S==='select')document.querySelectorAll('.member-card').forEach(card=>{const canvas=card.querySelector('canvas'),preview=canvas.getContext('2d');preview.clearRect(0,0,canvas.width,canvas.height);drawMember(card.dataset.member,canvas.width/2,canvas.height/2+2,84,preview)});
}

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(!(S==='play'&&paused)){gameClock+=dt;update(dt)}syncRainAudio();$('pauseBtn').classList.toggle('hide',S!=='play'||paused);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function setX(x){if(S==='play')tx=Math.max(24,Math.min(W-24,x))}
cv.addEventListener('pointermove',e=>setX(e.clientX));
cv.addEventListener('pointerdown',e=>{setX(e.clientX);if(S==='menu'){flash=.5;thunder(false)}});
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});

function show(id){['menu','select','info','end','pause'].forEach(x=>$(x).classList.add('hide'));if(id)$(id).classList.remove('hide')}
function pauseGame(){if(S!=='play'||paused)return;paused=true;pauseGameSong();show('pause')}
function resumeGame(){if(S!=='play'||!paused)return;paused=false;show(null);startGameSong()}
function start(){S='select';document.documentElement.classList.add('selecting');show('select')}
$('pauseBtn').onclick=pauseGame;
$('bResume').onclick=resumeGame;
$('bPauseHome').onclick=()=>{pauseGameSong(true);paused=false;S='menu';show('menu')};
$('bStart').onclick=start;
$('bAgain').onclick=()=>{ac();reset();S='play';show(null);startGameSong(true)};
$('bSelectBack').onclick=()=>{document.documentElement.classList.remove('selecting');S='menu';show('menu')};
document.querySelectorAll('.member-card').forEach(card=>card.onclick=()=>{selectedMember=card.dataset.member;document.documentElement.classList.remove('selecting');ac();reset();S='play';show(null);startGameSong(true)});
$('bHome').onclick=()=>{pauseGameSong(true);S='menu';show('menu')};
$('bBack').onclick=()=>show('menu');
$('bBest').onclick=()=>{$('infoT').textContent='🏆 أعلى النتائج';$('infoB').textContent='أفضل نتيجة لك: '+best;show('info')};
$('bHow').onclick=()=>{$('infoT').textContent='❓ كيف ألعب';$('infoB').innerHTML='اسحب إصبعك يميناً ويساراً (أو الأسهم في الكمبيوتر).<br>اجمع ⭐ و💜 وتجنّب البرق: يظهر عمود تحذير أصفر قبل الضربة.<br>انجُ من البرق في آخر لحظة لتحصل على PERFECT! ✨<br>5 مراحل، وعندك 3 قلوب.';show('info')};
$('bSnd').onclick=()=>{snd=!snd;$('bSnd').textContent=snd?'🔊 الصوت: يعمل':'🔇 الصوت: متوقف';syncRainAudio();if(snd)startGameSong();else pauseGameSong(true)};
$('bShare').onclick=async()=>{const t='جبت '+st.score+' نقطة في لعبة Perfect Storm ⚡💜 MOA';try{if(navigator.share)await navigator.share({text:t,url:location.href});else{await navigator.clipboard.writeText(t+' '+location.href);$('bShare').textContent='✅ تم النسخ'}}catch(e){}};
reset();
})();
</script>
